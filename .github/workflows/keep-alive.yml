name: Keep Render service awake

# Render's free tier spins a service down after ~15 minutes idle, and a cold
# start delays the first request enough to miss a reminder trigger window.
# Pinging every 10 minutes leaves margin: GitHub's scheduler is best-effort and
# can run several minutes late at peak times.
#
# Set the target once, in Settings > Secrets and variables > Actions > Variables:
#   RENDER_SERVICE_URL = https://<your-service>.onrender.com
# If it is unset the job exits successfully rather than failing, so a fork or a
# fresh clone does not show a red Actions tab.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          set -e
          if [ -z "$SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL is not set; skipping."
            exit 0
          fi
          echo "Pinging ${SERVICE_URL}/health"
          # -f treats a non-2xx response as failure so the run goes red when the
          # service is actually down. --max-time bounds a cold start.
          curl -f --max-time 30 "${SERVICE_URL}/health"
