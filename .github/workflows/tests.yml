name: tests

# Runs the suite in tests/. Green as of the commit that fixed D-8; before that,
# 24 of 50 assertions checked for identifiers that no longer existed, so adding
# CI first would have produced a permanently red badge.
#
# Two tests are marked expectedFailure: multi-leg transfers are not formatted
# (known-issues C-11). They document intended behaviour and do not fail the run.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        # The suite loads modules by file path and does not touch the network or
        # a database, so no service containers and no credentials are needed.
        run: python -m unittest discover -s tests -v
