    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode patch file
        run: echo "$FIX_PATCH_B64" | tr -d '\n' | base64 -d > /tmp/fix.patch

      - name: Apply patch
        run: |
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch

      - name: Verify Python files still import cleanly
        run: |
          cd backend
          pip install -r requirements.txt
          python -m py_compile app/reminder_scheduler.py app/tasks.py app/celery_app.py app/main.py app/models.py app/crud.py
          python -c "import sys; sys.path.insert(0, '.'); import app.tasks; import app.celery_app; print('imports OK')"

      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-commute-fix.yml
          git config user.name "claude-commute-fix"
