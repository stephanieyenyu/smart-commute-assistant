<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排程設定 - Smart Commute</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .loading-container {
            text-align: center;
            padding: 50px 20px;
            color: white;
        }

        .loading-container h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .loading-container small {
            font-size: 14px;
            color: #eee;
            word-break: break-all;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none; /* 預設隱藏，JS 成功後顯示 */
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input[type="text"],
        .form-group input[type="time"],
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
        }

        .weekday-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .weekday-btn {
            padding: 12px 5px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .weekday-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .weekday-btn:active {
            transform: scale(0.95);
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .preset-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .preset-btn.active {
            background: #48bb78;
            color: white;
            border-color: #48bb78;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .loading.active {
            display: block;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }

        .message.error {
            background: #fed7d7;
            color: #742a2a;
            display: block;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- 載入提示區域：預設顯示，失敗時顯示錯誤，成功時隱藏 -->
    <div class="loading-container" id="loadingText">
        <h1>⏳ 載入中，請稍候...</h1>
    </div>

    <!-- 表單容器：預設隱藏 -->
    <div class="container" id="mainContainer">
        <div class="header">
            <h1>📅 排程設定</h1>
            <p>設定您的通勤排程</p>
        </div>

        <form id="scheduleForm">
            <div class="form-group">
                <label for="originAddress">📍 出發地</label>
                <input type="text" id="originAddress" name="originAddress" placeholder="輸入出發地址（可留空使用預設家裡）">
                <div class="hint">留空將使用您設定的住家地址</div>
            </div>

            <div class="form-group">
                <label for="destination">🏢 目的地</label>
                <input type="text" id="destination" name="destination" placeholder="輸入目的地（如：公司、學校）" required>
            </div>

            <div class="form-group">
                <label for="arrivalTime">⏰ 預計抵達時間</label>
                <input type="time" id="arrivalTime" name="arrivalTime" required>
            </div>

            <div class="form-group">
                <label>📆 提醒星期</label>
                <div class="preset-buttons">
                    <button type="button" class="preset-btn" data-preset="workdays">平日</button>
                    <button type="button" class="preset-btn" data-preset="everyday">每天</button>
                    <button type="button" class="preset-btn" data-preset="weekend">假日</button>
                </div>
                <div class="weekday-group" id="weekdayGroup">
                    <button type="button" class="weekday-btn" data-day="0">週一</button>
                    <button type="button" class="weekday-btn" data-day="1">週二</button>
                    <button type="button" class="weekday-btn" data-day="2">週三</button>
                    <button type="button" class="weekday-btn" data-day="3">週四</button>
                    <button type="button" class="weekday-btn" data-day="4">週五</button>
                    <button type="button" class="weekday-btn" data-day="5">週六</button>
                    <button type="button" class="weekday-btn" data-day="6">週日</button>
                </div>
                <div class="hint">點選星期設定排程，可複選</div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">💾 儲存排程</button>
        </form>

        <div class="loading" id="loading">處理中...</div>
        <div class="message" id="message"></div>
    </div>

    <!-- LIFF SDK 引入 -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <script>
        // LIFF 初始化
        let userId = null;

        // 頁面載入後立即初始化 LIFF
        window.addEventListener('load', function() {
            // 檢查 liff SDK 是否載入
            if (typeof liff === 'undefined') {
                const errorMsg = "LIFF SDK 未載入，請檢查網路連線";
                document.getElementById('loadingText').innerHTML = `
                    <h1>❌ LIFF SDK 載入失敗</h1>
                    <small>${errorMsg}</small>
                `;
                alert("LIFF 錯誤: " + errorMsg);
                return;
            }

            liff.init({ liffId: '2009982765-aKb3T2ca' })
                .then(() => {
                    // 檢查登入狀態
                    if (!liff.isLoggedIn()) {
                        liff.login();
                        return; // 登入後會重新整理，所以這邊直接 return
                    }

                    // 初始化成功：隱藏載入提示，顯示表單
                    document.getElementById('loadingText').style.display = 'none';
                    document.getElementById('mainContainer').style.display = 'block';

                    // 取得使用者 ID
                    liff.getProfile().then(profile => {
                        userId = profile.userId;
                        
                        // 從 URL 參數取得可能的預設值
                        const urlParams = new URLSearchParams(window.location.search);
                        const editId = urlParams.get('edit');
                        if (editId) {
                            document.querySelector('.header h1').textContent = '✏️ 編輯排程';
                        }
                    }).catch(err => {
                        console.error('Get Profile Error:', err);
                    });

                })
                .catch((err) => {
                    // 初始化失敗：顯示錯誤訊息在頁面上並彈出 alert
                    console.error('LIFF Init Error:', err);
                    
                    const errorMsg = "LIFF 發生錯誤：" + err;
                    const loadingTextEl = document.getElementById('loadingText');
                    
                    // 替換載入中的文字為具體錯誤訊息
                    loadingTextEl.innerHTML = `
                        <h1>❌ LIFF 初始化失敗</h1>
                        <small>${err}</small>
                    `;
                    
                    // 彈出警告視窗
                    alert(errorMsg);
                });
        });

        // 星期選擇邏輯
        const weekdayButtons = document.querySelectorAll('.weekday-btn');
        const presetButtons = document.querySelectorAll('.preset-btn');
        let selectedWeekdays = [];

        weekdayButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const day = parseInt(this.dataset.day);
                if (this.classList.contains('active')) {
                    this.classList.remove('active');
                    selectedWeekdays = selectedWeekdays.filter(d => d !== day);
                } else {
                    this.classList.add('active');
                    selectedWeekdays.push(day);
                    selectedWeekdays.sort();
                }
                // 清除預設按鈕的 active 狀態
                presetButtons.forEach(pb => pb.classList.remove('active'));
            });
        });

        presetButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const preset = this.dataset.preset;
                presetButtons.forEach(pb => pb.classList.remove('active'));
                this.classList.add('active');
                
                // 清除所有星期按鈕
                weekdayButtons.forEach(wb => wb.classList.remove('active'));
                selectedWeekdays = [];

                // 根據預設設定星期
                if (preset === 'workdays') {
                    [0, 1, 2, 3, 4].forEach(d => {
                        document.querySelector(`.weekday-btn[data-day="${d}"]`).classList.add('active');
                        selectedWeekdays.push(d);
                    });
                } else if (preset === 'everyday') {
                    [0, 1, 2, 3, 4, 5, 6].forEach(d => {
                        document.querySelector(`.weekday-btn[data-day="${d}"]`).classList.add('active');
                        selectedWeekdays.push(d);
                    });
                } else if (preset === 'weekend') {
                    [5, 6].forEach(d => {
                        document.querySelector(`.weekday-btn[data-day="${d}"]`).classList.add('active');
                        selectedWeekdays.push(d);
                    });
                }
            });
        });

        // 表單提交
        document.getElementById('scheduleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!userId) {
                showMessage('使用者未登入，請重新整理頁面', 'error');
                return;
            }

            if (selectedWeekdays.length === 0) {
                showMessage('請至少選擇一個星期', 'error');
                return;
            }

            const originAddress = document.getElementById('originAddress').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const arrivalTime = document.getElementById('arrivalTime').value;

            if (!destination) {
                showMessage('請輸入目的地', 'error');
                return;
            }

            if (!arrivalTime) {
                showMessage('請選擇預計抵達時間', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            submitBtn.disabled = true;
            loading.classList.add('active');
            hideMessage();

            try {
                const response = await fetch('/api/schedule/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: userId,
                        destination: destination,
                        arrivalTime: arrivalTime,
                        originAddress: originAddress || null,
                        weekdays: selectedWeekdays,
                    }),
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    showMessage('✅ 排程設定成功！', 'success');
                    setTimeout(() => {
                        liff.closeWindow();
                    }, 1500);
                } else {
                    showMessage(result.detail || '排程設定失敗，請重試', 'error');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('提交失敗:', error);
                showMessage('網路錯誤，請確認網路連線', 'error');
                submitBtn.disabled = false;
            } finally {
                loading.classList.remove('active');
            }
        });

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function hideMessage() {
            const messageEl = document.getElementById('message');
            messageEl.style.display = 'none';
        }
    </script>
</body>
</html>
